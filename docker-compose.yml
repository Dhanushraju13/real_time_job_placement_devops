services:
  frontend:
    build: ./frontend
    image: ${FRONTEND_IMAGE:-placement-frontend:latest}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build: ./backend
    image: ${BACKEND_IMAGE:-placement-backend:latest}
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://placement:placement@db:5432/placement}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-placement_super_secret_jwt_key_2026_devops_platform_secure_token}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-System Admin}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@placement.edu}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-Admin@123}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-placement}
      POSTGRES_USER: ${POSTGRES_USER:-placement}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-placement}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-placement} -d ${POSTGRES_DB:-placement}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  nginx:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  pgdata:
